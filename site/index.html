<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screens in Schools | Take the 5-minute survey on tech in K-12 schools</title>
  <meta name="description" content="Educators, librarians and teens: take the 5-minute Screens in Schools survey on phones, screen time and AI in schools. A nonpartisan research initiative in partnership with the National Governors Association." />
  <link rel="canonical" href="https://screensinschools.org/" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#1E4034" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-mark-64.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-mark-512.png" />
  <link rel="apple-touch-icon" href="favicon-mark-512.png" />

  <!-- Social sharing (Facebook, LinkedIn, Slack, iMessage) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Screens in Schools" />
  <meta property="og:title" content="Screens in Schools" />
  <meta property="og:description" content="How does your school handle tech? Is it working? Take the 5-minute survey. A nonpartisan research initiative in partnership with the National Governors Association." />
  <meta property="og:url" content="https://screensinschools.org/" />
  <meta property="og:image" content="https://screensinschools.org/social-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Screens in Schools logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Screens in Schools" />
  <meta name="twitter:description" content="How does your school handle tech? Is it working? Take the 5-minute survey. A nonpartisan research initiative in partnership with the National Governors Association." />
  <meta name="twitter:image" content="https://screensinschools.org/social-card.jpg" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchOrganization",
    "name": "Screens in Schools",
    "alternateName": "Phones in Focus",
    "url": "https://screensinschools.org/",
    "logo": "https://screensinschools.org/favicon-mark-512.png",
    "description": "A nonpartisan research initiative in partnership with the National Governors Association. Our work supports evidence-based policies for technology use in schools.",
    "email": "screensinschools@wharton.upenn.edu",
    "parentOrganization": { "@type": "CollegeOrUniversity", "name": "University of Pennsylvania" }
  }
  </script>
  <style>
    /* Remove default spacing and ensure full height */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    /* Base styles for a clean background */
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    /* Responsive iframe container */
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Style the iframe to fill its container */
    .iframe-container iframe {
      position: absolute;
      border: none;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <!-- CHANGE 1: no fixed src here; the script below sets it so UTM tags on this page's URL can be passed through -->
    <iframe
      id="survey"
      title="Screens in Schools Survey">
    </iframe>
  </div>

  <!-- CHANGE 2: copy utm_source, utm_medium, utm_campaign from the page URL onto the survey URL -->
  <script>
    (function () {
      var base = 'https://wharton.qualtrics.com/jfe/form/SV_bxUuSACfns11z5s';
      var page = new URLSearchParams(window.location.search);
      var out = new URLSearchParams();
      ['utm_source', 'utm_medium', 'utm_campaign'].forEach(function (key) {
        var value = page.get(key);
        if (value) out.set(key, value);
      });
      var query = out.toString();
      document.getElementById('survey').src = query ? base + '?' + query : base;
    })();
  </script>
  <!-- Fallback if scripts are disabled: load the plain survey -->
  <noscript>
    <div class="iframe-container">
      <iframe src="https://wharton.qualtrics.com/jfe/form/SV_bxUuSACfns11z5s" title="Screens in Schools Survey"></iframe>
    </div>
  </noscript>
</body>
</html>
